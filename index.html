<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>THÔNG TIN KHÁCH SIM AI</title>

<meta name="theme-color" content="#09152b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIM AI">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --night:#071326;
  --night2:#0c1d38;
  --gold:#f5b34c;
  --gold2:#ffd98c;
  --white:#f7f4e9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:var(--night)}
body{position:fixed;inset:0}

#appFrame{
  position:fixed;inset:0;width:100%;height:100%;
  border:0;display:block;background:#fff;
  opacity:0;transform:scale(1.002);
  transition:opacity .45s ease,transform .45s ease;
}
body.app-ready #appFrame{opacity:1;transform:scale(1)}

#loading{
  position:fixed;inset:0;z-index:20;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 50% 25%,rgba(255,215,132,.10),transparent 25%),
    linear-gradient(180deg,#071326 0%,#0b1c35 55%,#102746 100%);
  transition:opacity .45s ease,visibility .45s ease;
}
#loading.hide{opacity:0;visibility:hidden;pointer-events:none}

.stars{
  position:absolute;inset:0;opacity:.6;
  background-image:
    radial-gradient(circle,rgba(255,235,180,.75) 0 1px,transparent 1.5px),
    radial-gradient(circle,rgba(255,255,255,.55) 0 1px,transparent 1.5px);
  background-size:83px 97px,137px 121px;
  background-position:18px 14px,52px 38px;
}

.moon{
  position:absolute;
  top:7vh;right:10vw;
  width:clamp(72px,22vw,112px);
  aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 38% 35%,#fff9d9 0 45%,#ffe9a5 72%,#f6c968 100%);
  box-shadow:0 0 35px rgba(255,220,120,.28);
}
.moon:after{
  content:"";position:absolute;inset:12% 7% 8% 18%;
  border-radius:50%;opacity:.22;
  background:
    radial-gradient(circle at 30% 35%,#b9893d 0 4%,transparent 5%),
    radial-gradient(circle at 66% 58%,#b9893d 0 5%,transparent 6%),
    radial-gradient(circle at 50% 75%,#b9893d 0 3%,transparent 4%);
}

.scene{
  position:absolute;left:0;right:0;bottom:0;height:42%;
  overflow:hidden;pointer-events:none;
}
.mountain{
  position:absolute;bottom:7%;width:125%;height:58%;
  border-radius:50% 50% 0 0;
  filter:blur(1.2px);
}
.m1{left:-35%;background:linear-gradient(180deg,rgba(30,66,83,.65),rgba(7,23,42,.95))}
.m2{right:-38%;bottom:3%;background:linear-gradient(180deg,rgba(42,79,92,.48),rgba(7,22,40,.98));transform:scale(.82)}
.m3{left:-10%;bottom:-4%;background:linear-gradient(180deg,rgba(18,51,69,.82),rgba(5,18,34,1));transform:scale(.68)}
.mist{
  position:absolute;left:-10%;bottom:13%;width:120%;height:34%;
  background:radial-gradient(ellipse at center,rgba(224,231,220,.14),transparent 68%);
  filter:blur(12px);
}

.lake{
  position:absolute;left:0;right:0;bottom:0;height:25%;
  background:
    linear-gradient(180deg,rgba(13,40,59,.1),rgba(4,16,31,.9)),
    repeating-linear-gradient(180deg,transparent 0 13px,rgba(255,255,255,.025) 14px 15px);
}

.lanterns{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.lantern{
  --x:50%;--delay:0s;--dur:8s;--size:28px;
  position:absolute;left:var(--x);bottom:-70px;
  width:var(--size);height:calc(var(--size)*1.18);
  opacity:0;animation:floatLantern var(--dur) linear var(--delay) infinite;
}
.lantern:before{
  content:"";position:absolute;left:14%;top:15%;width:72%;height:66%;
  border-radius:45% 45% 40% 40%;
  background:radial-gradient(circle at 35% 28%,#fff0a8 0 8%,#f7bd45 25%,#d86d24 68%,#8d321d 100%);
  box-shadow:0 0 16px rgba(255,169,65,.38);
}
.lantern:after{
  content:"";position:absolute;left:50%;top:0;width:1px;height:100%;
  background:linear-gradient(#f0bd5b 0 7%,transparent 7% 88%,#f0bd5b 88%);
  box-shadow:-8px 18px 0 -0.2px rgba(239,174,67,.7),8px 18px 0 -0.2px rgba(239,174,67,.7);
}
.lantern i{
  position:absolute;left:27%;bottom:7%;width:46%;height:10%;
  border-radius:50%;background:#f3b84e;box-shadow:0 5px 8px rgba(246,170,55,.35);
}
.l1{--x:8%;--delay:-1s;--dur:9s;--size:22px}
.l2{--x:22%;--delay:-5s;--dur:11s;--size:30px}
.l3{--x:38%;--delay:-7s;--dur:8.5s;--size:20px}
.l4{--x:56%;--delay:-3s;--dur:10s;--size:27px}
.l5{--x:73%;--delay:-8s;--dur:9.5s;--size:21px}
.l6{--x:88%;--delay:-4s;--dur:12s;--size:31px}

.card{
  position:relative;z-index:5;
  width:min(92vw,390px);
  margin-top:-4vh;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;
}
.badge{
  padding:7px 13px;border-radius:999px;
  border:1px solid rgba(255,218,137,.16);
  background:rgba(255,255,255,.055);
  color:rgba(255,248,226,.9);
  font-size:12px;backdrop-filter:blur(5px);
}
.badge b{
  display:inline-block;width:7px;height:7px;margin-right:7px;
  border-radius:50%;background:var(--gold);
  box-shadow:0 0 10px rgba(245,179,76,.7);
}

.logo{
  width:clamp(105px,31vw,140px);
  height:clamp(105px,31vw,140px);
  margin:22px 0 15px;
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 12px 25px rgba(0,0,0,.34));
  animation:logoFloat 3s ease-in-out infinite;
}
.title{
  margin:0;color:var(--gold2);
  font-size:clamp(22px,7vw,30px);
  line-height:1.12;font-weight:900;
  letter-spacing:.4px;text-transform:uppercase;
  text-shadow:0 0 18px rgba(245,179,76,.13);
}
.sub{margin-top:9px;color:var(--white);font-size:14px;opacity:.92}
.progress{
  width:min(82vw,260px);height:7px;margin-top:18px;
  border-radius:99px;overflow:hidden;background:rgba(255,255,255,.09);
}
.bar{
  height:100%;width:12%;border-radius:inherit;
  background:linear-gradient(90deg,#d98b2d,#f5b34c,#ffe0a0);
  box-shadow:0 0 14px rgba(245,179,76,.35);
  transition:width .25s ease;
}
.caption{margin-top:9px;color:rgba(247,244,233,.72);font-size:12px}
.dots{display:flex;gap:7px;margin-top:14px}
.dots i{
  width:7px;height:7px;border-radius:50%;background:var(--gold);
  animation:blink 1.2s ease-in-out infinite;
}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}

@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,80%,100%{opacity:.35;transform:scale(.8)}40%{opacity:1;transform:scale(1.15)}}
@keyframes floatLantern{
  0%{transform:translate3d(0,0,0) rotate(-3deg) scale(.8);opacity:0}
  10%{opacity:.82}
  50%{transform:translate3d(18px,-48vh,0) rotate(5deg) scale(1)}
  90%{opacity:.35}
  100%{transform:translate3d(-14px,-105vh,0) rotate(-4deg) scale(.88);opacity:0}
}
@media(max-height:650px){
  .moon{top:4vh}
  .card{margin-top:-2vh}
  .logo{margin:12px 0 10px;width:100px;height:100px}
  .progress{margin-top:12px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

<body>

<iframe
  id="appFrame"
  src="https://script.google.com/macros/s/AKfycbz2c3Ud95ElKmXTnj7sY9O_m_llFzB8Qdt1wiIOnZCXa7IeOAS7eAMLTFuvo_-XxbPU/exec"
  allow="clipboard-read; clipboard-write"
  loading="eager"
  title="SIM AI"
></iframe>

<!-- CHỈ CÓ 1 LOGO Ở ĐÂY.
     ĐÃ XÓA HOÀN TOÀN INTRO-LOGO + LOGO THỨ HAI CỦA CODE CŨ. -->
<section id="loading" aria-label="Đang tải ứng dụng">
  <div class="stars"></div>
  <div class="moon"></div>

  <div class="lanterns">
    <span class="lantern l1"><i></i></span>
    <span class="lantern l2"><i></i></span>
    <span class="lantern l3"><i></i></span>
    <span class="lantern l4"><i></i></span>
    <span class="lantern l5"><i></i></span>
    <span class="lantern l6"><i></i></span>
  </div>

  <div class="scene">
    <div class="mountain m1"></div>
    <div class="mountain m2"></div>
    <div class="mountain m3"></div>
    <div class="mist"></div>
    <div class="lake"></div>
  </div>

  <div class="card">
    <div class="badge"><b></b>SIM AI • Đang khởi động</div>

    <!-- LOGO DUY NHẤT -->
    <img src="logo-loading.png" class="logo" alt="SIM AI">

    <h1 class="title">THÔNG TIN KHÁCH SIM AI</h1>
    <div class="sub">Đang mở ứng dụng</div>

    <div class="progress">
      <div class="bar" id="progressBar"></div>
    </div>
    <div class="caption" id="loadingCaption">Vui lòng chờ trong giây lát</div>

    <div class="dots"><i></i><i></i><i></i></div>
  </div>
</section>

<script>
(() => {
  const frame = document.getElementById("appFrame");
  const loading = document.getElementById("loading");
  const bar = document.getElementById("progressBar");
  const caption = document.getElementById("loadingCaption");

  let progress = 12;
  let done = false;

  const texts = [
    "Vui lòng chờ trong giây lát",
    "Đang kết nối dữ liệu khách hàng...",
    "Đang chuẩn bị giao diện SIM AI...",
    "Sắp hoàn tất..."
  ];

  function textFor(v){
    return v < 30 ? texts[0] :
           v < 55 ? texts[1] :
           v < 80 ? texts[2] : texts[3];
  }

  const timer = setInterval(() => {
    if(done) return;

    if(progress < 35) progress += Math.random() * 5;
    else if(progress < 60) progress += Math.random() * 3;
    else if(progress < 82) progress += Math.random() * 1.8;
    else if(progress < 92) progress += Math.random() * .7;

    progress = Math.min(progress,92);
    bar.style.width = progress + "%";
    caption.textContent = textFor(progress);
  },220);

  function finish(){
    if(done) return;
    done = true;
    clearInterval(timer);

    bar.style.width = "100%";
    caption.textContent = "Hoàn tất";
    document.body.classList.add("app-ready");

    setTimeout(() => loading.classList.add("hide"),180);
  }

  /* Khi Google Web App tải xong -> mở ứng dụng */
  frame.addEventListener("load", () => {
    setTimeout(finish,700);
  });

  /* Không để màn hình loading treo vô hạn */
  setTimeout(() => {
    if(!done) finish();
  },8500);
})();
</script>

</body>
</html>
