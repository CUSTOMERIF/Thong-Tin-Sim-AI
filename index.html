<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>THÔNG TIN KHÁCH SIM AI</title>

  <meta name="theme-color" content="#07142f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />
  <meta name="apple-mobile-web-app-title" content="SIM AI" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <style>
    :root {
      --night: #050d20;
      --night2: #091b3d;
      --night3: #102c5a;

      --gold: #ffb52e;
      --gold2: #ffd76a;
      --gold3: #fff1b0;

      --text: #fff8df;
      --muted: rgba(255, 248, 223, 0.78);

      --red: #d93636;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--night);
    }

    /* =====================================================
       APP CHÍNH
    ===================================================== */

    #appFrame {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;

      opacity: 0;
      transform: scale(1.015);

      transition:
        opacity 0.7s ease,
        transform 0.7s ease;

      background: #07142f;
    }

    body.app-ready #appFrame {
      opacity: 1;
      transform: scale(1);
    }

    /* =====================================================
       MÀN HÌNH TRUNG THU
    ===================================================== */

    .mid-autumn {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 32%,
          rgba(255, 198, 70, 0.18),
          transparent 22%
        ),
        radial-gradient(
          circle at 20% 80%,
          rgba(47, 110, 202, 0.22),
          transparent 30%
        ),
        radial-gradient(
          circle at 80% 72%,
          rgba(115, 58, 170, 0.2),
          transparent 30%
        ),
        linear-gradient(
          180deg,
          #030918 0%,
          #071735 48%,
          #0d2852 100%
        );

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
    }

    .mid-autumn.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* =====================================================
       SAO
    ===================================================== */

    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .stars span {
      position: absolute;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: #fff5c8;

      box-shadow:
        0 0 7px rgba(255, 221, 116, 0.9),
        0 0 14px rgba(255, 194, 65, 0.45);

      animation: twinkle 2.5s ease-in-out infinite;
    }

    .stars span:nth-child(1) {
      left: 12%;
      top: 18%;
    }

    .stars span:nth-child(2) {
      left: 25%;
      top: 11%;
      animation-delay: 0.5s;
    }

    .stars span:nth-child(3) {
      left: 77%;
      top: 15%;
      animation-delay: 1s;
    }

    .stars span:nth-child(4) {
      left: 88%;
      top: 29%;
      animation-delay: 0.8s;
    }

    .stars span:nth-child(5) {
      left: 68%;
      top: 38%;
      animation-delay: 1.5s;
    }

    .stars span:nth-child(6) {
      left: 8%;
      top: 40%;
      animation-delay: 1.2s;
    }

    .stars span:nth-child(7) {
      left: 38%;
      top: 24%;
      animation-delay: 0.2s;
    }

    .stars span:nth-child(8) {
      left: 56%;
      top: 12%;
      animation-delay: 1.7s;
    }

    @keyframes twinkle {
      0%,
      100% {
        opacity: 0.25;
        transform: scale(0.7);
      }

      50% {
        opacity: 1;
        transform: scale(1.5);
      }
    }

    /* =====================================================
       MẶT TRĂNG
    ===================================================== */

    .moon {
      position: absolute;

      top: 10%;
      left: 50%;

      width: 170px;
      height: 170px;

      transform: translateX(-50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 30%,
          #fffce5 0%,
          #ffe89a 45%,
          #ffc84d 78%,
          #e99a20 100%
        );

      box-shadow:
        0 0 25px rgba(255, 210, 85, 0.6),
        0 0 70px rgba(255, 184, 42, 0.32),
        0 0 130px rgba(255, 167, 32, 0.15);

      animation: moonFloat 4s ease-in-out infinite;
    }

    .moon::before,
    .moon::after {
      content: "";

      position: absolute;

      border-radius: 50%;

      background: rgba(214, 155, 45, 0.13);
    }

    .moon::before {
      width: 35px;
      height: 25px;

      left: 30px;
      top: 48px;
    }

    .moon::after {
      width: 25px;
      height: 18px;

      right: 30px;
      top: 90px;
    }

    @keyframes moonFloat {
      0%,
      100% {
        transform: translateX(-50%) translateY(0);
      }

      50% {
        transform: translateX(-50%) translateY(-8px);
      }
    }

    /* =====================================================
       MÂY
    ===================================================== */

    .cloud {
      position: absolute;

      width: 170px;
      height: 45px;

      opacity: 0.13;

      border-radius: 50%;

      background: #dce9ff;

      filter: blur(1px);

      animation: cloudMove 14s linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";

      position: absolute;

      border-radius: 50%;

      background: #dce9ff;
    }

    .cloud::before {
      width: 65px;
      height: 65px;

      left: 25px;
      bottom: 0;
    }

    .cloud::after {
      width: 85px;
      height: 85px;

      right: 25px;
      bottom: 0;
    }

    .cloud.one {
      top: 28%;
      left: -200px;
    }

    .cloud.two {
      top: 43%;
      left: -260px;

      opacity: 0.08;

      transform: scale(0.75);

      animation-delay: 5s;
    }

    @keyframes cloudMove {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(calc(100vw + 500px));
      }
    }

    /* =====================================================
       ĐÈN LỒNG
    ===================================================== */

    .lantern {
      position: absolute;

      top: -12px;

      width: 54px;
      height: 76px;

      border-radius: 50% 50% 46% 46%;

      background:
        linear-gradient(
          90deg,
          #a71926,
          #e83d32 30%,
          #ffb32e 50%,
          #df312e 70%,
          #991621
        );

      box-shadow:
        0 0 18px rgba(255, 99, 35, 0.6),
        0 0 45px rgba(255, 153, 44, 0.35);

      animation: lanternSwing 3.5s ease-in-out infinite;
    }

    .lantern::before {
      content: "";

      position: absolute;

      top: -17px;
      left: 21px;

      width: 12px;
      height: 18px;

      border: 2px solid #f7b84b;
      border-bottom: none;

      border-radius: 12px 12px 0 0;
    }

    .lantern::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: -28px;

      width: 2px;
      height: 30px;

      background: #f3b33b;

      box-shadow:
        -8px 20px 0 -0.5px #f3b33b,
        8px 20px 0 -0.5px #f3b33b;
    }

    .lantern.left {
      left: 6%;
      transform-origin: top center;
    }

    .lantern.right {
      right: 6%;
      top: 18px;
      transform-origin: top center;
      animation-delay: 0.9s;
      transform: scale(0.82);
    }

    @keyframes lanternSwing {
      0%,
      100% {
        transform: rotate(-5deg);
      }

      50% {
        transform: rotate(5deg);
      }
    }

    /* =====================================================
       NỀN TRÒN TRANG TRÍ
    ===================================================== */

    .gold-orbit {
      position: absolute;

      width: 330px;
      height: 330px;

      border-radius: 50%;

      border: 1px solid rgba(255, 207, 91, 0.18);

      box-shadow:
        0 0 45px rgba(255, 190, 55, 0.08) inset,
        0 0 40px rgba(255, 190, 55, 0.05);

      animation: orbitPulse 4s ease-in-out infinite;
    }

    .gold-orbit::before {
      content: "";

      position: absolute;
      inset: 20px;

      border-radius: 50%;

      border: 1px solid rgba(255, 218, 111, 0.08);
    }

    @keyframes orbitPulse {
      0%,
      100% {
        transform: scale(0.96);
        opacity: 0.5;
      }

      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    /* =====================================================
       NỘI DUNG
    ===================================================== */

    .splash-content {
      position: relative;
      z-index: 10;

      width: min(92vw, 430px);

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      padding: 25px 18px 40px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      padding: 9px 16px;

      border-radius: 999px;

      color: #fff7dd;

      font-size: 13px;

      background: rgba(255, 255, 255, 0.065);

      border: 1px solid rgba(255, 224, 139, 0.15);

      backdrop-filter: blur(10px);

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.15);

      animation: fadeUp 0.8s ease both;
    }

    .status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--gold);

      box-shadow:
        0 0 12px rgba(255, 190, 45, 0.9);

      animation: statusPulse 1.3s ease-in-out infinite;
    }

    @keyframes statusPulse {
      0%,
      100% {
        transform: scale(0.8);
      }

      50% {
        transform: scale(1.25);
      }
    }

    /* =====================================================
       LOGO
    ===================================================== */

    .logo-container {
      position: relative;

      width: 150px;
      height: 150px;

      margin-top: 35px;
      margin-bottom: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      animation: logoAppear 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .logo-container::before {
      content: "";

      position: absolute;
      inset: -20px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 190, 52, 0.24),
          rgba(255, 190, 52, 0.06) 45%,
          transparent 72%
        );

      animation: logoGlow 3s ease-in-out infinite;
    }

    .logo {
      position: relative;
      z-index: 2;

      width: 128px;
      height: 128px;

      object-fit: contain;

      border-radius: 28px;

      padding: 7px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.95),
          rgba(255, 247, 220, 0.82)
        );

      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.35),
        0 0 35px rgba(255, 178, 40, 0.28);

      animation: logoFloat 3.2s ease-in-out infinite;
    }

    @keyframes logoAppear {
      from {
        opacity: 0;
        transform: scale(0.65) translateY(15px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes logoFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-7px);
      }
    }

    @keyframes logoGlow {
      0%,
      100% {
        transform: scale(0.92);
        opacity: 0.65;
      }

      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }

    /* =====================================================
       TIÊU ĐỀ
    ===================================================== */

    .greeting {
      margin: 0;

      font-size: clamp(27px, 8vw, 38px);

      line-height: 1.1;

      font-weight: 900;

      letter-spacing: 0.3px;

      color: var(--gold2);

      text-shadow:
        0 2px 0 rgba(128, 58, 0, 0.35),
        0 0 22px rgba(255, 183, 44, 0.28);

      animation: fadeUp 1s ease 0.15s both;
    }

    .app-name {
      margin-top: 11px;

      font-size: 15px;

      letter-spacing: 2.2px;

      font-weight: 700;

      color: #fff9e6;

      animation: fadeUp 1s ease 0.25s both;
    }

    .message {
      margin-top: 9px;

      font-size: 13px;

      line-height: 1.6;

      color: var(--muted);

      animation: fadeUp 1s ease 0.35s both;
    }

    /* =====================================================
       LOADING
    ===================================================== */

    .progress-area {
      width: min(82vw, 290px);

      margin-top: 25px;

      animation: fadeUp 1s ease 0.45s both;
    }

    .progress-track {
      position: relative;

      width: 100%;
      height: 7px;

      overflow: hidden;

      border-radius: 999px;

      background: rgba(255, 255, 255, 0.09);

      border: 1px solid rgba(255, 224, 137, 0.08);
    }

    .progress-bar {
      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      width: 8%;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          #e89522,
          #ffd76a,
          #fff1b0
        );

      box-shadow:
        0 0 18px rgba(255, 188, 47, 0.55);

      transition: width 0.25s ease;
    }

    .progress-shine {
      position: absolute;

      top: -8px;
      bottom: -8px;

      left: -80px;

      width: 65px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.8),
          transparent
        );

      filter: blur(5px);

      animation: progressShine 1.7s ease-in-out infinite;
    }

    @keyframes progressShine {
      from {
        left: -80px;
      }

      to {
        left: calc(100% + 30px);
      }
    }

    .loading-text {
      margin-top: 10px;

      font-size: 12px;

      color: rgba(255, 248, 223, 0.7);
    }

    .loading-dots {
      display: flex;

      gap: 7px;

      margin-top: 15px;
    }

    .loading-dots span {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--gold);

      box-shadow:
        0 0 10px rgba(255, 188, 47, 0.55);

      animation: dot 1.2s ease-in-out infinite;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loading-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes dot {
      0%,
      80%,
      100% {
        opacity: 0.35;
        transform: translateY(0);
      }

      40% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    /* =====================================================
       DÒNG TRANG TRÍ DƯỚI
    ===================================================== */

    .bottom-decoration {
      position: absolute;

      bottom: 0;
      left: 0;
      right: 0;

      height: 125px;

      background:
        radial-gradient(
          ellipse at 50% 100%,
          rgba(255, 178, 45, 0.2),
          transparent 65%
        );

      pointer-events: none;
    }

    .bottom-line {
      position: absolute;

      bottom: 28px;
      left: 50%;

      width: 150px;
      height: 1px;

      transform: translateX(-50%);

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 211, 101, 0.55),
          transparent
        );
    }

    /* =====================================================
       ANIMATION CHUNG
    ===================================================== */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(13px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 480px) {
      .moon {
        width: 145px;
        height: 145px;

        top: 9%;
      }

      .lantern {
        transform: scale(0.82);
      }

      .lantern.right {
        transform: scale(0.7);
      }

      .gold-orbit {
        width: 280px;
        height: 280px;
      }

      .logo-container {
        width: 135px;
        height: 135px;

        margin-top: 28px;
      }

      .logo {
        width: 116px;
        height: 116px;

        border-radius: 25px;
      }

      .greeting {
        font-size: 29px;
      }

      .app-name {
        font-size: 14px;
        letter-spacing: 1.7px;
      }

      .message {
        max-width: 280px;
      }

      .progress-area {
        width: 76vw;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       APP CHÍNH
       GIỮ NGUYÊN APP GOOGLE APPS SCRIPT
  ====================================================== -->

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbz2c3Ud95ElKmXTnj7sY9O_m_llFzB8Qdt1wiIOnZCXa7IeOAS7eAMLTFuvo_-XxbPU/exec"
    allow="clipboard-read; clipboard-write"
    loading="eager"
  ></iframe>


  <!-- =====================================================
       SPLASH TRUNG THU
  ====================================================== -->

  <div class="mid-autumn" id="midAutumn">

    <!-- SAO -->
    <div class="stars">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>


    <!-- MẶT TRĂNG -->

      <div class="status">

          src="logo-loading.png"

        />

      <!-- TIÊU ĐỀ -->
      <h1 class="greeting">
        🌕 CHÚC MỪNG TRUNG THU

      <div class="message">

    <div class="bottom-decoration"></div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    const frame = document.getElementById("appFrame");

    const midAutumn =
      document.getElementById("midAutumn");

    const progressBar =
      document.getElementById("progressBar");

    const loadingText =
      document.getElementById("loadingText");


    let hidden = false;

    let progress = 8;

    let progres
