<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>THÔNG TIN KHÁCH SIM AI</title>
<meta name="theme-color" content="#071a38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIM AI">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg1:#061126;--bg2:#0b1d40;--bg3:#12305b;--gold:#f5a43b;--gold2:#ffd98b;--text:#eef5ff;--muted:rgba(238,245,255,.78)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:var(--bg2)}
#appFrame{width:100%;height:100vh;border:0;display:block;opacity:.02;transform:scale(1.01);transition:opacity .55s ease,transform .55s ease;background:var(--bg2)}
body.app-ready #appFrame{opacity:1;transform:scale(1)}

.loading{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:
radial-gradient(circle at 50% 68%,rgba(245,164,59,.18),transparent 32%),
radial-gradient(circle at 50% 12%,rgba(255,220,150,.08),transparent 25%),
linear-gradient(180deg,var(--bg1),var(--bg2) 52%,var(--bg3));transition:opacity .65s ease,visibility .65s ease}
.loading.hide{opacity:0;visibility:hidden;pointer-events:none}
.moon{position:absolute;top:7%;right:11%;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fff8dc,#ffd98b 48%,#f5a43b 78%,rgba(245,164,59,0) 80%);box-shadow:0 0 55px rgba(255,210,120,.3);opacity:.9}
.moon:after{content:"";position:absolute;inset:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(180,120,50,.12) 0 7%,transparent 8%),radial-gradient(circle at 70% 60%,rgba(180,120,50,.10) 0 9%,transparent 10%)}
.stars{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.65) 0 1px,transparent 1.5px);background-size:83px 91px;opacity:.18}
.hills{position:absolute;left:-10%;right:-10%;bottom:-8px;height:170px;opacity:.48;filter:blur(1px)}
.hill{position:absolute;bottom:0;width:70%;height:115px;border-radius:50% 50% 0 0/100% 100% 0 0;background:linear-gradient(180deg,rgba(16,48,82,.8),rgba(4,18,39,.98));transform:skewX(-12deg)}
.hill.a{left:-14%;height:120px}.hill.b{left:27%;height:92px;transform:skewX(12deg)}.hill.c{right:-18%;height:135px}
.water{position:absolute;left:0;right:0;bottom:0;height:58px;background:linear-gradient(180deg,rgba(35,77,105,.18),rgba(3,16,35,.72));box-shadow:0 -1px 0 rgba(255,220,160,.12) inset}
.loading-card{position:relative;z-index:5;width:min(92vw,420px);padding:20px 18px 28px;text-align:center;display:flex;flex-direction:column;align-items:center}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#eef5ff;font-size:12px;letter-spacing:.3px;margin-bottom:12px;backdrop-filter:blur(6px)}
.badge .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px rgba(245,164,59,.6);animation:pulse 1.4s infinite}
.logo-stage{position:relative;width:230px;height:230px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.sun{position:absolute;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,218,150,.3),rgba(245,164,59,.09) 42%,transparent 70%);animation:sun 3s ease-in-out infinite}
.logo-box{position:relative;z-index:4;width:140px;height:140px;border-radius:30px;overflow:hidden;background:rgba(255,255,255,.08);box-shadow:0 18px 40px rgba(0,0,0,.38),0 0 0 1px rgba(255,255,255,.08) inset,0 0 30px rgba(245,164,59,.14);backdrop-filter:blur(4px);animation:float 3s ease-in-out infinite}
.logo-box img{width:100%;height:100%;object-fit:contain;display:block;padding:8px}
.lantern{position:absolute;z-index:3;width:27px;height:34px;border-radius:48% 48% 42% 42%;background:radial-gradient(circle at 50% 55%,#fff0b0 0 16%,#ffb02e 34%,#c64c17 75%);box-shadow:0 0 18px rgba(255,180,55,.75);opacity:0;animation:rise linear infinite}
.lantern:before{content:"";position:absolute;left:5px;right:5px;top:-5px;height:5px;border-radius:50%;border-top:2px solid #ffd98b}
.lantern:after{content:"";position:absolute;left:11px;bottom:-8px;width:5px;height:9px;background:#ffd98b;border-radius:0 0 5px 5px}
.l1{left:7%;bottom:-25px;animation-duration:6.8s;animation-delay:.2s}.l2{left:23%;bottom:-35px;transform:scale(.75);animation-duration:7.8s;animation-delay:2s}.l3{right:18%;bottom:-30px;transform:scale(.82);animation-duration:7.1s;animation-delay:1.1s}.l4{right:5%;bottom:-40px;transform:scale(.62);animation-duration:8.5s;animation-delay:3.1s}
.title{margin:0;font-size:28px;font-weight:900;line-height:1.12;color:var(--gold);text-shadow:0 0 20px rgba(245,164,59,.15);text-transform:uppercase}
.sub{margin-top:9px;max-width:320px;color:var(--text);opacity:.95;line-height:1.55;font-size:14px}
.progress-wrap{width:min(84vw,260px);margin-top:17px}
.progress-track{position:relative;width:100%;height:8px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08)}
.progress-bar{position:absolute;inset:0 auto 0 0;width:12%;border-radius:999px;background:linear-gradient(90deg,#df8122,var(--gold),var(--gold2));box-shadow:0 0 18px rgba(245,164,59,.34);transition:width .25s ease}
.caption{margin-top:9px;font-size:12px;color:var(--muted)}
.dots{margin-top:15px;display:flex;gap:8px}.dots span{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px rgba(245,164,59,.45);animation:blink 1.2s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes pulse{50%{transform:scale(1.2);opacity:1}}
@keyframes sun{50%{transform:scale(1.08);opacity:.85}}
@keyframes float{0%,100%{transform:translateY(8px) scale(.97)}50%{transform:translateY(-7px) scale(1.03)}}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.7) rotate(-4deg)}12%{opacity:.9}75%{opacity:.65}100%{opacity:0;transform:translateY(-290px) scale(1) rotate(5deg)}}
@keyframes blink{40%{transform:translateY(-4px) scale(1.1);opacity:1}80%,100%{opacity:.45}}
@media(max-width:480px){.moon{width:72px;height:72px;right:8%;top:7%}.logo-stage{width:190px;height:190px}.logo-box{width:118px;height:118px;border-radius:26px}.title{font-size:24px}.sub{font-size:13px}.hills{height:145px}}
</style>
</head>
<body>

<iframe id="appFrame"
src="https://script.google.com/macros/s/AKfycbz2c3Ud95ElKmXTnj7sY9O_m_llFzB8Qdt1wiIOnZCXa7IeOAS7eAMLTFuvo_-XxbPU/exec"
allow="clipboard-read; clipboard-write"
loading="eager"></iframe>

<div class="loading" id="loading">
  <div class="stars"></div>
  <div class="moon"></div>
  <div class="hills"><div class="hill a"></div><div class="hill b"></div><div class="hill c"></div></div>
  <div class="water"></div>
  <div class="lantern l1"></div><div class="lantern l2"></div><div class="lantern l3"></div><div class="lantern l4"></div>

  <div class="loading-card">
    <div class="badge"><span class="dot"></span><span>SIM AI • Đang khởi động</span></div>
    <div class="logo-stage">
      <div class="sun"></div>
      <div class="logo-box"><img src="logo-loading.png" alt="SIM AI Logo"></div>
    </div>
    <h1 class="title">SIM AI</h1>
    <div class="sub">Đang mở ứng dụng</div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      <div class="caption" id="loadingCaption">Vui lòng chờ trong giây lát</div>
    </div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</div>

<script>
const frame=document.getElementById("appFrame");
const loading=document.getElementById("loading");
const progressBar=document.getElementById("progressBar");
const loadingCaption=document.getElementById("loadingCaption");

let hasHidden=false,fakeProgress=12,progressTimer=null,loadingStarted=false;

const loadingTexts=[
  "Vui lòng chờ trong giây lát",
  "Đang kết nối dữ liệu khách hàng...",
  "Đang chuẩn bị giao diện SIM AI...",
  "Sắp hoàn tất..."
];

function updateProgressText(value){
  if(value<30) loadingCaption.textContent=loadingTexts[0];
  else if(value<55) loadingCaption.textContent=loadingTexts[1];
  else if(value<80) loadingCaption.textContent=loadingTexts[2];
  else loadingCaption.textContent=loadingTexts[3];
}

function startFakeProgress(){
  if(loadingStarted)return;
  loadingStarted=true;
  progressBar.style.width=fakeProgress+"%";
  updateProgressText(fakeProgress);

  progressTimer=setInterval(()=>{
    if(hasHidden)return;
    if(fakeProgress<35) fakeProgress+=Math.random()*6;
    else if(fakeProgress<60) fakeProgress+=Math.random()*4;
    else if(fakeProgress<82) fakeProgress+=Math.random()*2.4;
    else if(fakeProgress<92) fakeProgress+=Math.random()*1.1;
    if(fakeProgress>92)fakeProgress=92;
    progressBar.style.width=fakeProgress+"%";
    updateProgressText(fakeProgress);
  },220);
}

function hideLoading(){
  if(hasHidden)return;
  hasHidden=true;
  clearInterval(progressTimer);
  progressBar.style.width="100%";
  loadingCaption.textContent="Hoàn tất";
  document.body.classList.add("app-ready");
  setTimeout(()=>loading.classList.add("hide"),260);
}

/* Chỉ có MỘT màn loading, không có INTRO LOGO thứ hai. */
loading.style.display="flex";
startFakeProgress();

/* Giữ nguyên cơ chế iframe của code gốc. */
frame.addEventListener("load",()=>{
  setTimeout(hideLoading,1200);
});

/* Chống treo khi mạng chậm. */
setTimeout(hideLoading,8500);
</script>
</body>
</html>
